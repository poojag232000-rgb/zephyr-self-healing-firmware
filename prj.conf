# Kernel diagnostics
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_HW_STACK_PROTECTION=y

# Per-thread supervision backed by the STM32 independent hardware watchdog.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=2
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=2000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=1000

# Persistent crash/recovery records in the final internal-Flash partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_HWINFO=y

# MCUboot image state and trial/confirm/rollback control.
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_SHELL=y

# Phase 5: Zephyr system PM with the internal STM32 RTC as the low-power
# companion for Cortex-M SysTick. No external component is required.
CONFIG_PM=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_COUNTER=y
CONFIG_COUNTER_RTC_STM32=y
CONFIG_COUNTER_RTC_STM32_SUBSECONDS=y
CONFIG_STATS=y
CONFIG_STATS_NAMES=y
CONFIG_STATS_SHELL=y
CONFIG_PM_STATS=y

# Zephyr UART console and interactive shell over the on-board ST-LINK VCP.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_KERNEL_SHELL=y

# Route deferred Zephyr logs through the shell backend so command output and
# asynchronous watchdog events share one serial interface safely.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_LOG_BACKEND=y

